<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --cream: #f5eee9;
        --sand: #e3e1d4;
        --olive: #373f1d;
        --sage: #5c6e21;
        --grey: #7d7f68;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Inter", sans-serif; color: var(--olive); }
      #bg { position: absolute; inset: 0; background: var(--cream); }
      .scene { position: absolute; inset: 0; }
      .inner { position: absolute; inset: 0; padding: 150px 190px; display: flex; flex-direction: column; justify-content: center; }
      .label { font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey); }
      .display { font-family: "Fraunces", serif; font-weight: 300; letter-spacing: -0.03em; line-height: 1; }
      .mask { overflow: hidden; padding-bottom: 0.14em; }
      #s1-title { font-size: 250px; margin-top: 28px; }
      #s1-rule { height: 2px; background: var(--olive); margin: 30px 0 44px; width: 1100px; }
      #s1-lead { font-size: 60px; }
      #s2-inner { flex-direction: row; align-items: center; justify-content: space-between; gap: 120px; }
      #s2-house { position: relative; width: 760px; height: 640px; flex: none; }
      .lvl { position: absolute; left: 0; height: 180px; border: 3px solid var(--olive); background: var(--sand); }
      .lvl span { position: absolute; left: 28px; top: 22px; font-size: 26px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); }
      #lvl0 { bottom: 40px; width: 760px; }
      #lvl1 { bottom: 220px; width: 760px; }
      #lvl2 { bottom: 400px; width: 500px; }
      #s2-ground { position: absolute; left: -60px; bottom: 38px; width: 880px; height: 3px; background: var(--olive); }
      #s2-rail { position: absolute; left: 500px; bottom: 400px; width: 260px; height: 70px; border: 3px solid var(--sage); border-left: 0; border-bottom: 0; }
      #s2-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 64px 90px; }
      .stat b { display: block; font-size: 112px; white-space: nowrap; }
      .stat small { font-size: 28px; color: var(--grey); }
      #s3 { background: var(--olive); color: var(--cream); }
      #s3-title { font-size: 150px; max-width: 1400px; }
      #s3-sub { font-size: 32px; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 56px; color: #c9cbb4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="bg"></div>

      <section id="s1" class="clip scene" data-start="0" data-duration="5" data-track-index="0">
        <div id="s1-inner" class="inner">
          <p id="s1-label" class="label">Triplex contemporain · 240 m²</p>
          <div class="mask"><h1 id="s1-title" class="display">Maison Aubier</h1></div>
          <div id="s1-rule"></div>
          <div class="mask"><p id="s1-lead" class="display">Trois niveaux. Une seule lumière.</p></div>
        </div>
      </section>

      <section id="s2" class="clip scene" data-start="5" data-duration="5" data-track-index="0">
        <div id="s2-inner" class="inner">
          <div id="s2-house">
            <div id="s2-ground"></div>
            <div id="lvl0" class="lvl"><span>Niveau 0 · Jardin</span></div>
            <div id="lvl1" class="lvl"><span>Niveau 1 · Nuit</span></div>
            <div id="lvl2" class="lvl"><span>Niveau 2 · Ciel</span></div>
            <div id="s2-rail"></div>
          </div>
          <div id="s2-stats">
            <div class="stat" id="st1"><b class="display"><span id="n1">0</span> m²</b><small>habitables</small></div>
            <div class="stat" id="st2"><b class="display"><span id="n2">0</span></b><small>niveaux</small></div>
            <div class="stat" id="st3"><b class="display"><span id="n3">0</span></b><small>pièces</small></div>
            <div class="stat" id="st4"><b class="display"><span id="n4">0</span> m²</b><small>de terrasse</small></div>
          </div>
        </div>
      </section>

      <section id="s3" class="clip scene" data-start="10" data-duration="4" data-track-index="0">
        <div id="s3-inner" class="inner">
          <div class="mask"><h2 id="s3-title" class="display">Visitez chaque pièce, à votre rythme.</h2></div>
          <p id="s3-sub">Maison Aubier — visite 3D interactive</p>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXPO = "expo.out";

      // Scène 1 : carton titre
      tl.fromTo("#s1-label", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1.1, ease: EXPO }, 0.2);
      tl.fromTo("#s1-title", { yPercent: 110 }, { yPercent: 0, duration: 1.4, ease: EXPO }, 0.4);
      tl.fromTo("#s1-rule", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 1.4, ease: EXPO }, 1.1);
      tl.fromTo("#s1-lead", { yPercent: 110 }, { yPercent: 0, duration: 1.2, ease: EXPO }, 1.6);
      tl.fromTo("#s1-inner", { opacity: 1, y: 0 }, { opacity: 0, y: -40, duration: 0.7, ease: "power2.in" }, 4.25);

      // Scène 2 : coupe de la maison et chiffres
      tl.fromTo("#s2-ground", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 1.0, ease: EXPO }, 5.1);
      ["#lvl0", "#lvl1", "#lvl2"].forEach((id, i) => {
        tl.fromTo(id, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.0, ease: EXPO }, 5.4 + i * 0.45);
      });
      tl.fromTo("#s2-rail", { opacity: 0, scaleX: 0, transformOrigin: "0 100%" }, { opacity: 1, scaleX: 1, duration: 0.9, ease: EXPO }, 6.9);
      [["#st1", "#n1", 240], ["#st2", "#n2", 3], ["#st3", "#n3", 10], ["#st4", "#n4", 32]].forEach(([box, num, end], i) => {
        const o = { v: 0 };
        const at = 5.8 + i * 0.3;
        tl.fromTo(box, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.0, ease: EXPO }, at);
        tl.fromTo(o, { v: 0 }, { v: end, duration: 1.6, ease: "power2.out", onUpdate: () => { document.querySelector(num).textContent = Math.round(o.v); } }, at);
      });
      tl.fromTo("#s2-inner", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.in" }, 9.35);

      // Scène 3 : invitation à la visite
      tl.fromTo("#s3-inner", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 10.0);
      tl.fromTo("#s3-title", { yPercent: 110 }, { yPercent: 0, duration: 1.4, ease: EXPO }, 10.2);
      tl.fromTo("#s3-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.2, ease: EXPO }, 11.2);
      tl.fromTo("#s3-inner", { scale: 1 }, { scale: 1.02, duration: 2.2, ease: "none" }, 11.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
